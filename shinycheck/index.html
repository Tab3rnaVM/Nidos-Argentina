    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="../libs/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/fontawesome.css" />
    <link rel="stylesheet" href="../assets/css/templatemo-cyborg-gaming.css?v=1.5" />
    <link rel="stylesheet" href="../assets/css/nidos-system.css?v=1.0" />


    <link rel="icon" href="../assets/images/logo/favicon-64.png" type="image/png" />
    <!-- Preload de imágenes de regiones -->
    <link rel="preload" href="../assets/images/regiones/kanto.png" as="image">
    <link rel="preload" href="../assets/images/regiones/johto.png" as="image">
    <link rel="preload" href="../assets/images/regiones/hoenn.png" as="image">
    <link rel="preload" href="../assets/images/regiones/sinnoh.png" as="image">
    <link rel="preload" href="../assets/images/regiones/unova.png" as="image">
    <link rel="preload" href="../assets/images/regiones/kalos.png" as="image">
    <link rel="preload" href="../assets/images/regiones/alola.png" as="image">
    <link rel="preload" href="../assets/images/regiones/galar.png" as="image">
    <link rel="preload" href="../assets/images/regiones/hisui.png" as="image">
    <link rel="preload" href="../assets/images/regiones/paldea.png" as="image">
    <link rel="canonical" href="https://nidosargentina.com/shinycheck/" />
    <title>Nidos Argentina | Shiny Check</title>
</head>


  <body>
    <div id="js-preloader" class="js-preloader">
      <div class="preloader-inner">
        <span class="dot"></span>
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="page-content shiny-page">
            <h1 class="sr-only">Shiny Check</h1>
            <div class="secciontitle events-showcase-title shiny-showcase-title">
              <div class="col-lg-12">
                <div class="heading-section">
                  <h4>Lista de Pokémon Brillantes</h4>
                </div>
                <p class="section-kicker">
                  Marca tu colección shiny, revisa tu avance por región y encuentra faltantes más rápido.
                </p>
                <p class="update-bar shiny-update">
                  Última actualización: <span id="updateDate"></span>
                </p>
              </div>
            </div>

            <div class="shiny-dashboard">
              <div class="shiny-progress-card">
                <span class="shiny-progress-kicker">Progreso total</span>
                <strong id="shinyTotalCounter">0/0</strong>
                <div class="shiny-progress-track" aria-hidden="true">
                  <span id="shinyTotalProgress"></span>
                </div>
                <p id="shinyRemainingCounter">Selecciona tus primeros shiny para comenzar.</p>
              </div>

              <div class="shiny-tool-panel">
                <label class="shiny-search" for="shinySearchInput">
                  <i class="fas fa-search" aria-hidden="true"></i>
                  <input id="shinySearchInput" type="search" placeholder="Buscar por número o región" autocomplete="off" />
                </label>

                <div class="shiny-filter-group" aria-label="Filtrar colección shiny">
                  <button class="shiny-filter is-active" type="button" data-filter="all">Todos</button>
                  <button class="shiny-filter" type="button" data-filter="caught">Capturados</button>
                  <button class="shiny-filter" type="button" data-filter="missing">Faltantes</button>
                </div>
              </div>
            </div>
            
            <div class="selecttype-placeholder"></div>
            <div class="scroll-bar-sections shiny-region-nav" aria-label="Regiones shiny">
              <button class="shiny-region-button" type="button" data-target="kanto">Kanto</button>
              <button class="shiny-region-button" type="button" data-target="johto">Johto</button>
              <button class="shiny-region-button" type="button" data-target="hoenn">Hoenn</button>
              <button class="shiny-region-button" type="button" data-target="sinnoh">Sinnoh</button>
              <button class="shiny-region-button" type="button" data-target="unova">Unova</button>
              <button class="shiny-region-button" type="button" data-target="kalos">Kalos</button>
              <button class="shiny-region-button" type="button" data-target="alola">Alola</button>
              <button class="shiny-region-button" type="button" data-target="galar">Galar</button>
              <button class="shiny-region-button" type="button" data-target="hisui">Hisui</button>
              <button class="shiny-region-button" type="button" data-target="paldea">Paldea</button>
            </div>                        

            <div class="event-list">
              <div id="mainContainer"></div>
            </div>
          </div>
        </div>
      </div>

      <footer
        class="text-white mt-4 p-2"
        style="background-color: #ffffff; border-radius: 23px"
      >
      </footer>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const lastUpdated = "23/03/2026"; // Cambia esta fecha según sea necesario
        document.getElementById("updateDate").textContent = lastUpdated;
      });
    </script>
    
    <script defer src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>

    <script defer src="../assets/js/menu.js"></script>
    <script defer src="../assets/js/footer.js"></script>
    <script defer src="../libs/jquery/jquery.min.js"></script>





    <script defer src="../assets/js/custom.js"></script>
    <script defer src="../assets/js/shinylist.js"></script>
    <script defer src="../assets/js/politicas.js"></script>

  </body>
</html>
